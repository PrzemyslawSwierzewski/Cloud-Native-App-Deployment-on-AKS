name: Build & Push to ACR

on:
  push:
    branches:
      - main
      - staging
      - dev
    paths:
      - 'app/**'
      - '.github/workflows/Build-deploy.yml'

env:
  REGISTRY: azurecr.io
  FRONTEND_IMAGE: frontend
  BACKEND_IMAGE: backend

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      acr_name: ${{ steps.vars.outputs.acr_name }}
      acr_url: ${{ steps.vars.outputs.acr_url }}
    steps:
      - id: vars
        run: |
          case "${{ github.ref_name }}" in
            main)
              ACR_NAME="${{ vars.PROD_ACR_NAME }}"
              ;;
            staging)
              ACR_NAME="${{ vars.STAGING_ACR_NAME }}"
              ;;
            dev)
              ACR_NAME="${{ vars.DEV_ACR_NAME }}"
              ;;
          esac
          echo "acr_name=${ACR_NAME}" >> $GITHUB_OUTPUT
          echo "acr_url=${ACR_NAME}.azurecr.io" >> $GITHUB_OUTPUT

  build:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        run: az acr login --name ${{ needs.setup.outputs.acr_name }}

      - name: Build & push frontend
        run: |
          cd app/frontend
          docker build \
            --build-arg REACT_APP_API_URL="/" \
            -t ${{ needs.setup.outputs.acr_url }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
            -t ${{ needs.setup.outputs.acr_url }}/${{ env.FRONTEND_IMAGE }}:latest \
            .
          docker push ${{ needs.setup.outputs.acr_url }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          docker push ${{ needs.setup.outputs.acr_url }}/${{ env.FRONTEND_IMAGE }}:latest

      - name: Build & push backend
        run: |
          cd app/backend
          docker build \
            -t ${{ needs.setup.outputs.acr_url }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
            -t ${{ needs.setup.outputs.acr_url }}/${{ env.BACKEND_IMAGE }}:latest \
            .
          docker push ${{ needs.setup.outputs.acr_url }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          docker push ${{ needs.setup.outputs.acr_url }}/${{ env.BACKEND_IMAGE }}:latest