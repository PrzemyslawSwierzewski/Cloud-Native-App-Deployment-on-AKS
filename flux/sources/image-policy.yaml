# PROD Environment
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageRepository
metadata:
  name: prod-frontend-repo
  namespace: flux-system
spec:
  image: prodcontainerr.azurecr.io/frontend
  interval: 1m
  secretRef:
    name: prod-acr-credentials

---
apiVersion: image.toolkit.fluxcd.io/v1beta1
kind: ImagePolicy
metadata:
  name: prod-frontend-policy
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: prod-frontend-repo
  policy:
    semver:
      range: '>=0.0.0'

---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageRepository
metadata:
  name: prod-backend-repo
  namespace: flux-system
spec:
  image: prodcontainerr.azurecr.io/backend
  interval: 1m
  secretRef:
    name: prod-acr-credentials

---
apiVersion: image.toolkit.fluxcd.io/v1beta1
kind: ImagePolicy
metadata:
  name: prod-backend-policy
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: prod-backend-repo
  policy:
    semver:
      range: '>=0.0.0'

