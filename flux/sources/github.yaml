apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: app-repo
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/PrzemyslawSwierzewski/Cloud-Native-App-Deployment-on-AKS
  ref:
    branch: main
  secretRef:
    name: github-credentials

---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: app-repo-staging
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/PrzemyslawSwierzewski/Cloud-Native-App-Deployment-on-AKS
  ref:
    branch: staging
  secretRef:
    name: github-credentials

---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: app-repo-dev
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/PrzemyslawSwierzewski/Cloud-Native-App-Deployment-on-AKS
  ref:
    branch: dev
  secretRef:
    name: github-credentials
